<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="3D developer workspace for Matheesh Kumar S">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#101a32"/><stop offset="1" stop-color="#180d25"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f472b6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity=".45"/></filter>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="skewY(-22) scale(1 .7)"><path d="M50 0H0V50" fill="none" stroke="#334155" stroke-opacity=".35"/></pattern>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
